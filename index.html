<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ads Check — BM Control</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#263238;background:#f7fbfa;--green:#11b886;--line:#dfeae6;--muted:#87949a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f7fbfa}.app{display:flex;min-height:100vh}.sidebar{width:166px;flex:0 0 166px;background:#fff;border-right:1px solid #dcebe6;display:flex;flex-direction:column}.brand{height:64px;display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid #eef3f1}.brand-logo{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:#e5faf4;color:#049d74;font-weight:800;font-size:18px}.brand-name{font-weight:700;font-size:14px;color:#12a77d}.brand-sub{font-size:9px;color:#a2abad;margin-top:2px}.switch-label{padding:14px 10px 5px;color:#a0abad;font-size:10px}.select-box{margin:0 9px;padding:9px 10px;border:1px solid #10b981;border-radius:9px;color:#334155;font-size:11px;display:flex;justify-content:space-between;align-items:center}.menu-label{padding:20px 18px 8px;color:#a0abad;font-size:10px}.nav{display:flex;flex-direction:column;gap:3px;padding:0 8px}.nav button{border:0;background:transparent;text-align:left;border-radius:7px;padding:10px 10px;color:#536168;font-size:11px;cursor:pointer}.nav button:hover,.nav button.active{background:#e7faf4;color:#059669}.nav button span{margin-right:6px;color:#64748b}.sidebar-bottom{margin-top:auto;padding:12px 10px;color:#a0abad;font-size:11px}.pro{margin-top:7px;border:0;border-radius:14px;padding:7px 9px;background:#f5c542;color:#fff;font-weight:700;font-size:10px}.main{min-width:0;flex:1;display:flex;flex-direction:column}.top-tabs{height:47px;background:#fff;border-bottom:1px solid #e5eeeb;display:flex;align-items:stretch;gap:2px;padding-left:8px}.tab{border:0;background:transparent;padding:0 19px;color:#77848a;font-size:12px;cursor:pointer}.tab.active{color:#334155;font-weight:700;border-bottom:2px solid var(--green);background:#fbfefd}.toolbar{height:48px;display:flex;align-items:center;gap:8px;padding:6px 10px;background:#fff;border-bottom:1px solid #e0ece8}.tool{height:32px;border:1px solid #e0e7e5;border-radius:6px;background:#fff;color:#526067;font-size:11px;padding:0 10px;cursor:pointer;white-space:nowrap}.tool:hover{border-color:#8edbc4;color:#059669}.tool.primary{border-color:#13b98a;background:#13b98a;color:#fff;font-weight:700}.search{height:32px;width:190px;border:1px solid #e0e7e5;border-radius:6px;padding:0 10px;font-size:12px;outline:none;margin-left:auto}.search:focus{border-color:#13b98a}.content{padding:10px 10px 0;display:flex;flex-direction:column;min-height:0;flex:1}.notice{min-height:0}.loading,.error,.empty{padding:12px;border:1px solid #dbe9e5;border-radius:7px;background:#fff;font-size:12px;margin-bottom:8px}.loading{color:#087f5b}.error{color:#c24141;background:#fff8f8}.empty{color:#7b878d}.table-shell{flex:1;min-height:0;border:2px solid #18bb8c;border-radius:9px 9px 0 0;background:#fff;overflow:auto;box-shadow:0 2px 6px #0b8f6812}.bm-table{border-collapse:separate;border-spacing:0;width:100%;min-width:1320px;font-size:12px}.bm-table th{position:sticky;top:0;z-index:1;background:#f8fcfb;color:#263238;font-weight:700;padding:9px 9px;border-bottom:1px solid #dbe7e4;border-right:1px solid #edf3f1;white-space:nowrap;text-align:center}.bm-table td{height:44px;padding:7px 9px;border-bottom:1px solid #edf2f0;border-right:1px solid #edf3f1;white-space:nowrap;text-align:center;color:#4d5b61}.bm-table tr:hover td{background:#f5fffb}.bm-table td.name{text-align:left;min-width:210px}.name-main{font-weight:700;color:#263238;max-width:220px;overflow:hidden;text-overflow:ellipsis}.name-id{font-family:monospace;color:#87949a;font-size:11px;margin-top:3px}.check-btn{border:1px solid #a9dfd0;border-radius:5px;background:#effcf8;color:#078b68;padding:6px 8px;font-size:10px;cursor:pointer}.check-btn:hover{background:#dff8ef}.check-btn:disabled{opacity:.55;cursor:wait}.pill{display:inline-block;border-radius:10px;padding:4px 8px;font-size:11px;font-weight:700}.live{color:#16894e}.restricted{color:#df3d3d}.verified{color:#16894e}.unverified{color:#d17a14}.pending{color:#77848a}.footer{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:#8b979b;font-size:10px;background:#fff;border-top:1px solid #e2ece9}.footer strong{color:#0b9d74}.footer-actions{display:flex;align-items:center;gap:7px}.page-btn{border:1px solid #d9e7e3;background:#fff;border-radius:5px;padding:3px 7px;color:#657278;cursor:pointer}.detail-drawer{position:fixed;right:18px;bottom:52px;width:min(540px,calc(100vw - 30px));max-height:72vh;overflow:auto;display:none;background:#fff;border:1px solid #b8e8da;border-radius:10px;box-shadow:0 18px 50px #17483c33;padding:16px;z-index:4}.detail-drawer.open{display:block}.detail-head{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #edf2f0;padding-bottom:10px}.detail-head h3{font-size:14px;margin:0}.detail-head small{color:#87949a;font-family:monospace}.close{border:0;background:#f1f5f4;border-radius:5px;cursor:pointer}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.metric{padding:10px;background:#f7fcfa;border:1px solid #e0efea;border-radius:7px}.metric label{display:block;color:#87949a;font-size:10px}.metric b{display:block;margin-top:5px;color:#263238;font-size:12px;overflow:hidden;text-overflow:ellipsis}.sub-title{font-size:12px;font-weight:700;margin:16px 0 7px}.mini{width:100%;border-collapse:collapse;font-size:10px}.mini td,.mini th{padding:7px;border-bottom:1px solid #edf2f0;text-align:left}.mini th{color:#87949a;background:#f8fcfb}@media(max-width:800px){.sidebar{width:58px;flex-basis:58px}.brand{padding:8px 12px}.brand-name,.brand-sub,.switch-label,.select-box,.menu-label,.nav button:not(.active) span,.sidebar-bottom{display:none}.nav button{font-size:0;text-align:center}.nav button.active{font-size:18px}.search{width:130px}.metrics{grid-template-columns:repeat(2,1fr)}}

/* Readability pass */
.tab{font-size:13px}.tool{font-size:12px}.search{font-size:12px}.bm-table{font-size:13px}.bm-table th{font-size:12px;padding-top:11px;padding-bottom:11px}.bm-table td{font-size:13px;height:49px}.name-main{font-size:13px}.name-id{font-size:11px}.pill{font-size:11px}.check-btn{font-size:12px}.footer{font-size:11px}.nav button{font-size:12px}.select-box{font-size:12px}.menu-label,.switch-label{font-size:11px}.brand-name{font-size:15px}.brand-sub{font-size:10px}.sidebar-bottom{font-size:11px}.pro{font-size:11px}.tool.primary{font-size:12px}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brand-logo">▣</div><div><div class="brand-name">Ads Check</div><div class="brand-sub">by BM Control</div></div></div>
  <div class="switch-label">Chuyển phiên bản</div><div class="select-box">Ads Check V6 <span>⌄</span></div>
  <div class="menu-label">☰ MENU</div><nav class="nav"><button class="active">▣ <span>Ads Check Pro</span></button><button disabled>▤ <span>Trình quản lý</span></button><button disabled>▰ <span>Extended Payment</span></button><button disabled>◉ <span>Xóa QTV ẩn</span></button><button disabled>▤ <span>Đổi info TKQC</span></button><button disabled>◈ <span>Share Pixel</span></button><button disabled>◉ <span>Super Share</span></button><button disabled>● <span>Super Target</span></button><button disabled>▣ <span>Ads Save</span></button><button disabled>✉ <span>Kháng TKQC</span></button></nav>
  <div class="sidebar-bottom">Đang sử dụng<div class="pro">Phiên đăng nhập Pro</div></div>
</aside>
<main class="main">
  <div class="top-tabs"><button class="tab">TK Cá nhân</button><button class="tab active">TK BM</button><button class="tab">Page</button></div>
  <div class="toolbar"><button class="tool">◧ &nbsp; Ẩn công cụ</button><button class="tool primary" id="reloadBtn">▣ &nbsp; Tải tài khoản</button><input class="search" id="search" placeholder="⌕  Tìm kiếm tài khoản"/><button class="tool" id="clearSearch">↻</button><button class="tool" disabled>▤</button><button class="tool" disabled>▦</button><button class="tool" disabled>⌕</button><button class="tool" disabled>▤</button><button class="tool primary" disabled>🛒 Mua gói</button></div>
  <div class="content"><div id="notice"></div><div class="table-shell"><table class="bm-table"><thead><tr><th>□</th><th>Trạng thái ↕</th><th>Tên BM ↕</th><th>Loại BM ↕</th><th>Quyền sở hữu ↕</th><th>Limit ↕</th><th>Verified ↕</th><th>Created ↕</th><th>SL Admin ↕</th><th>SL Adaccount ↕</th><th>ID gốc ↕</th></tr></thead><tbody id="tableBody"></tbody></table></div></div>
  <div class="footer"><div><strong id="count">0</strong> Tài khoản BM</div><div class="footer-actions">Giới hạn dòng <b>50</b> <button class="page-btn">‹</button><button class="page-btn">›</button></div></div>
</main>
</div>
<div id="drawer" class="detail-drawer"></div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const extensionId = params.get('extensionId') || localStorage.getItem('bm-extension-id') || '';
  if (extensionId) localStorage.setItem('bm-extension-id', extensionId);
  const body = document.getElementById('tableBody'); const notice = document.getElementById('notice'); const count = document.getElementById('count'); const drawer = document.getElementById('drawer'); const search = document.getElementById('search'); let businesses=[];
  const esc = (v) => String(v ?? '—').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const send = (action,payload={}) => new Promise((resolve,reject)=>{ if(!extensionId)return reject(new Error('Hãy mở website bằng nút Trang chủ trong extension.')); chrome.runtime.sendMessage(extensionId,{source:'BM_DASHBOARD',action,requestId:crypto.randomUUID(),...payload},response=>{ if(chrome.runtime.lastError)return reject(new Error(chrome.runtime.lastError.message)); if(!response)return reject(new Error('Extension không trả về dữ liệu.')); resolve(response); }); });
  const arrCount = x => Array.isArray(x?.data)?x.data.length:(Array.isArray(x)?x.length:0);
  const date = x => x ? String(x).slice(0,10) : '—';
  const status = b => b.is_disabled_for_integrity_reasons ? ['Restricted','restricted'] : ['Live','live'];
  const verified = b => { const x=String(b.verification_status||'—'); return [x,x.toLowerCase().includes('verified')&&!x.toLowerCase().includes('not')?'verified':'unverified']; };
  const inferType = b => { const status=String(b.sharing_eligibility_status||'').toLowerCase(); if(!status)return '_'; return status==='enabled'?'BM350':'BM50'; };
  const inferLimit = b => { const account=b.owned_ad_accounts?.data?.[0]; const raw=account?.adtrust_dsl; const currency=String(account?.currency||'').trim().toUpperCase(); if(raw===undefined||raw===null||raw==='')return '_'; if(String(raw).trim()==='-1')return 'Nolimit'; const value=Number(raw); if(!Number.isFinite(value))return String(raw); const rounded=Math.round(value); const formatted=new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(rounded); return currency?formatted+' '+currency:formatted; };
  const rootId = b => b.original_id || b.root_id || b.id || '—';
  const render = () => { const q=search.value.trim().toLowerCase(); const rows=businesses.filter(b=>(b.name||'').toLowerCase().includes(q)||String(b.id).includes(q)); count.textContent=rows.length; body.innerHTML=rows.map((b)=>{const [st,sc]=status(b),[ver,vc]=verified(b);const checking=b.__checking;return `<tr><td>□</td><td><span class="pill ${sc}">${checking?'Checking…':st}</span></td><td class="name"><div class="name-main" title="${esc(b.name)}">${esc(b.name||'Không có tên')}</div><div class="name-id">${esc(b.id)}</div></td><td>${esc(inferType(b))}</td><td>${esc(b.role||b.ownership||'ADMIN')}</td><td>${esc(inferLimit(b))}</td><td><span class="pill ${vc}">${esc(ver)}</span></td><td>${esc(date(b.created_time))}</td><td>${arrCount(b.business_users)}</td><td>${arrCount(b.owned_ad_accounts)+arrCount(b.client_ad_accounts)}</td><td>${esc(rootId(b))}</td></tr>`}).join(''); };
  const showNotice=(type,text)=>notice.innerHTML=`<div class="${type}">${esc(text)}</div>`;
    const showDetails=b=>{const owned=Array.isArray(b.owned_ad_accounts?.data)?b.owned_ad_accounts.data:[];drawer.innerHTML=`<div class="detail-head"><div><h3>${esc(b.name||'Business Manager')}</h3><small>${esc(b.id)}</small></div><button class="close" id="close">×</button></div><div class="metrics"><div class="metric"><label>Trạng thái</label><b>${esc(status(b)[0])}</b></div><div class="metric"><label>Verified</label><b>${esc(b.verification_status)}</b></div><div class="metric"><label>Created</label><b>${esc(date(b.created_time))}</b></div><div class="metric"><label>Business users</label><b>${arrCount(b.business_users)}</b></div><div class="metric"><label>Owned ad accounts</label><b>${arrCount(b.owned_ad_accounts)}</b></div><div class="metric"><label>Client ad accounts</label><b>${arrCount(b.client_ad_accounts)}</b></div></div>${owned.length?`<div class="sub-title">Owned Ad Accounts</div><table class="mini"><thead><tr><th>ID</th><th>Currency</th><th>Status</th><th>Adtrust DSL</th></tr></thead><tbody>${owned.map(a=>`<tr><td>${esc(a.id)}</td><td>${esc(a.currency)}</td><td>${esc(a.account_status)}</td><td>${esc(a.adtrust_dsl)}</td></tr>`).join('')}</tbody></table>`:''}`;drawer.classList.add('open');document.getElementById('close').onclick=()=>drawer.classList.remove('open');};
  async function autoCheckAll(){const batchSize=50;let completed=0;for(let offset=0;offset<businesses.length;offset+=batchSize){const batch=businesses.slice(offset,offset+batchSize);batch.forEach(b=>{b.__checking=true;});render();showNotice('loading',`Đang kiểm tra BM: ${completed}/${businesses.length} · Lô ${Math.floor(offset/batchSize)+1}`);await Promise.all(batch.map(async business=>{try{const r=await send('CHECK_BM',{businessId:business.id});if(r.success){Object.assign(business,r.data?.business||{});business.__checked=true;}else{business.__checkError=r.error||'Kiểm tra thất bại';}}catch(error){business.__checkError=error.message||'Kiểm tra thất bại';}finally{business.__checking=false;completed++;}}));render();showNotice('loading',`Đã kiểm tra ${completed}/${businesses.length} BM`);}}
  async function load(){showNotice('loading','Đang kết nối extension và tải danh sách BM...');body.innerHTML='';try{const p=await send('PING');if(!p.success)throw new Error(p.error);const s=await send('CHECK_SESSION');if(!s.success)throw new Error(s.error);const r=await send('LOAD_BM');if(!r.success)throw new Error(r.error);businesses=r.data?.businesses||[];notice.innerHTML=businesses.length?'':'<div class="empty">Chưa có dữ liệu BM.</div>';render();if(businesses.length)await autoCheckAll();}catch(e){showNotice('error',e.message||'Không thể tải BM.');}}
  document.getElementById('reloadBtn').onclick=load; search.oninput=render; document.getElementById('clearSearch').onclick=()=>{search.value='';render();}; load();
})();
</script>
</body>
</html>
