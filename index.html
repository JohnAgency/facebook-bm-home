<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook BM Tool</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #1c1e21;
    }

    .card {
      width: min(560px, calc(100% - 40px));
      padding: 36px;
      text-align: center;
      background: white;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .12);
    }

    h1 {
      color: #1877f2;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Facebook BM Tool</h1>
    <p>Chào mừng bạn đến trang chủ.</p>
  </main>
</body>
</html>
