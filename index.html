<script>
(() => {
  const params = new URLSearchParams(location.search);
  const extensionId = params.get('extensionId') || localStorage.getItem('bm-extension-id') || '';
  if (extensionId) localStorage.setItem('bm-extension-id', extensionId);
  const body = document.getElementById('tableBody');
  const personalBody = document.getElementById('personalBody');
  const personalView = document.getElementById('personalView');
  const bmView = document.getElementById('bmView');
  const personalNotice = document.getElementById('personalNotice');
  const countLabel = document.getElementById('countLabel');
  const columnStorageKey='bm-control-column-order-v1';
  const defaultColumnOrder=['select','status','name','type','ownership','limit','verified','created','admins','accounts','root'];
  let columnOrder=(()=>{try{const v=JSON.parse(localStorage.getItem(columnStorageKey)||'null');return Array.isArray(v)&&v.length===defaultColumnOrder.length?v:defaultColumnOrder.slice();}catch{return defaultColumnOrder.slice();}})();
  const applyColumnOrder=()=>{const table=document.querySelector('.bm-table');if(!table)return;[table.tHead,...table.tBodies].forEach(section=>Array.from(section.rows).forEach(row=>{const cells=Array.from(row.children);columnOrder.forEach(key=>{const cell=cells.find(x=>x.dataset.col===key);if(cell)row.appendChild(cell);});}));};
  const setupColumnDrag=()=>{const table=document.querySelector('.bm-table');if(!table)return;const headers=table.querySelectorAll('th[data-col]');headers.forEach(th=>{th.draggable=false;if(th.dataset.col==='select')return;const handle=document.createElement('span');handle.className='drag-handle';handle.textContent='⋮⋮';handle.title='Kéo để di chuyển cột';handle.draggable=true;th.prepend(handle);handle.addEventListener('dragstart',e=>{e.stopPropagation();e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',th.dataset.col);th.classList.add('dragging');table.classList.add('is-dragging');});handle.addEventListener('dragend',()=>{th.classList.remove('dragging');table.classList.remove('is-dragging');headers.forEach(x=>x.classList.remove('drag-over'));});th.addEventListener('dragover',e=>{if(!table.classList.contains('is-dragging'))return;e.preventDefault();e.dataTransfer.dropEffect='move';headers.forEach(x=>x.classList.remove('drag-over'));th.classList.add('drag-over');});th.addEventListener('drop',e=>{e.preventDefault();const from=e.dataTransfer.getData('text/plain'),to=th.dataset.col;if(!from||from===to)return;const next=columnOrder.filter(x=>x!==from);const targetIndex=next.indexOf(to);next.splice(targetIndex<0?next.length:targetIndex,0,from);columnOrder=next;localStorage.setItem(columnStorageKey,JSON.stringify(columnOrder));applyColumnOrder();headers.forEach(x=>x.classList.remove('drag-over'));});});applyColumnOrder();};
  const resetColumnOrder=()=>{columnOrder=defaultColumnOrder.slice();localStorage.removeItem(columnStorageKey);applyColumnOrder();};
  const personalColumnKey = 'bm-control-personal-column-order-v1';
  let personalColumnOrder = (() => {
    const count = document.querySelector('.personal-table thead tr')?.children.length || 0;
    try {
      const saved = JSON.parse(localStorage.getItem(personalColumnKey) || 'null');
      return Array.isArray(saved) && saved.length === count ? saved : Array.from({length: count}, (_, i) => String(i));
    } catch { return Array.from({length: count}, (_, i) => String(i)); }
  })();
  const applyPersonalColumnOrder = () => {
    const table = document.querySelector('.personal-table');
    if (!table) return;
    [table.tHead, ...table.tBodies].forEach(section => Array.from(section.rows).forEach(row => {
      const cells = Array.from(row.children);
      personalColumnOrder.forEach(key => { const cell = cells.find(x => x.dataset.pcol === key); if (cell) row.appendChild(cell); });
    }));
  };
  const setupPersonalColumnControls = () => {
    const table = document.querySelector('.personal-table');
    const header = table?.tHead?.rows?.[0];
    if (!table || !header || table.dataset.controlsReady === '1') return;
    table.dataset.controlsReady = '1';
    Array.from(header.cells).forEach((th, index) => {
      th.dataset.pcol = String(index);
      if (index === 0) return;
      const handle = document.createElement('span');
      handle.className = 'personal-drag-handle';
      handle.textContent = '⋮⋮';
      handle.title = 'Kéo để di chuyển cột';
      handle.draggable = true;
      th.prepend(handle);
      handle.addEventListener('dragstart', event => {
        event.stopPropagation();
        table.classList.add('is-dragging');
        th.classList.add('personal-dragging');
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', th.dataset.pcol);
      });
      handle.addEventListener('dragend', () => {
        table.classList.remove('is-dragging');
        header.querySelectorAll('th').forEach(cell => cell.classList.remove('personal-drag-over', 'personal-dragging'));
      });
      th.addEventListener('dragover', event => {
        if (!table.classList.contains('is-dragging')) return;
        event.preventDefault();
        th.classList.add('personal-drag-over');
      });
      th.addEventListener('dragleave', () => th.classList.remove('personal-drag-over'));
      th.addEventListener('drop', event => {
        event.preventDefault();
        const from = event.dataTransfer.getData('text/plain');
        const to = th.dataset.pcol;
        if (!from || from === to) return;
        const next = personalColumnOrder.filter(key => key !== from);
        const target = next.indexOf(to);
        next.splice(target < 0 ? next.length : target, 0, from);
        personalColumnOrder = next;
        localStorage.setItem(personalColumnKey, JSON.stringify(next));
        applyPersonalColumnOrder();
        header.querySelectorAll('th').forEach(cell => cell.classList.remove('personal-drag-over'));
      });
    });
    applyPersonalColumnOrder();
  };
 const notice = document.getElementById('notice'); const count = document.getElementById('count'); const drawer = document.getElementById('drawer'); const search = document.getElementById('search'); const prevPage = document.getElementById('prevPage'); const nextPage = document.getElementById('nextPage'); const pageInfo = document.getElementById('pageInfo'); const PAGE_SIZE = 50; let bmPage=1; let personalPage=1; const selectedPersonalIds = new Set(); let businesses=[]; let personalAccounts=[]; let activeTab='bm';
  const esc = (v) => String(v ?? '—').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const send = (action,payload={}) => new Promise((resolve,reject)=>{ if(!extensionId)return reject(new Error('Hãy mở website bằng nút Trang chủ trong extension.')); chrome.runtime.sendMessage(extensionId,{source:'BM_DASHBOARD',action,requestId:crypto.randomUUID(),...payload},response=>{ if(chrome.runtime.lastError)return reject(new Error(chrome.runtime.lastError.message)); if(!response)return reject(new Error('Extension không trả về dữ liệu.')); resolve(response); }); });
  const arrCount = x => Array.isArray(x?.data)?x.data.length:(Array.isArray(x)?x.length:0);
  const date = x => x ? String(x).slice(0,10) : '—';
  const status = b => b.is_disabled_for_integrity_reasons ? ['Restricted','restricted'] : ['Live','live'];
  const verified = b => { const x=String(b.verification_status||'—'); return [x,x.toLowerCase().includes('verified')&&!x.toLowerCase().includes('not')?'verified':'unverified']; };
  const inferType = b => { const status=String(b.sharing_eligibility_status||'').toLowerCase(); if(!status)return '_'; return status==='enabled'?'BM350':'BM50'; };
  const inferLimit = b => { const raw=b.adAccountLimit ?? b.ad_account_limit; if(raw===undefined||raw===null||String(raw).trim()===''||String(raw).trim()==='_')return '_'; if(String(raw).trim()==='-1')return 'Nolimit'; const value=Number(raw); return Number.isFinite(value)?new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(Math.round(value)):String(raw); };
  const rootId = b => b.original_id || b.root_id || b.id || '—';
  const selectedIds = new Set();
  let sortKey=''; let sortDirection=1; let statusFilter='';
  const sortValue = (b,key) => { const [st]=status(b); if(key==='status')return st; if(key==='name')return String(b.name||'').toLowerCase(); if(key==='type'){const v=b.adAccountLimit ?? b.ad_account_limit; return v==='-1'?Number.POSITIVE_INFINITY:Number(v ?? -999999); } if(key==='ownership')return String(b.businessRole||b.business_role||'_'); if(key==='limit')return inferType(b); if(key==='verified')return String(b.verification_status||''); if(key==='created')return String(b.created_time||''); if(key==='admins')return Number(b.businessUsersAdminCount ?? 0); if(key==='accounts')return arrCount(b.owned_ad_accounts)+arrCount(b.client_ad_accounts); if(key==='root')return String(rootId(b)); return ''; };
  const visibleBusinesses = () => { const q=search.value.trim().toLowerCase(); let rows=businesses.filter(b=>(b.name||'').toLowerCase().includes(q)||String(b.id).includes(q)); if(statusFilter) rows=rows.filter(b=>status(b)[0]===statusFilter); if(sortKey) rows.sort((a,b)=>{const av=sortValue(a,sortKey),bv=sortValue(b,sortKey); if(av<bv)return -1*sortDirection;if(av>bv)return 1*sortDirection;return 0;}); return rows; };
  const updatePagination = totalPages => {
    pageInfo.textContent = `Trang ${activeTab === 'personal' ? personalPage : bmPage}/${totalPages}`;
    prevPage.disabled = (activeTab === 'personal' ? personalPage : bmPage) <= 1;
    nextPage.disabled = (activeTab === 'personal' ? personalPage : bmPage) >= totalPages;
  };
  const render = () => { const rows=visibleBusinesses(); const totalPages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE)); bmPage=Math.min(bmPage,totalPages); const pageRows=rows.slice((bmPage-1)*PAGE_SIZE,bmPage*PAGE_SIZE); count.textContent=rows.length; updatePagination(totalPages); body.innerHTML=pageRows.map((b)=>{const [st,sc]=status(b),[ver,vc]=verified(b);const checking=b.__checking;return `<tr><td data-col="select"><input type="checkbox" class="bm-select" data-bm-id="${esc(b.id)}" aria-label="Chọn BM ${esc(b.name||b.id)}" ${selectedIds.has(String(b.id))?'checked':''}></td><td data-col="status"><span class="pill ${b.__checkError ? 'restricted' : sc}" title="${esc(b.__checkError || '')}">${checking?'Checking…':(b.__checkError?'Lỗi':st)}</span>${b.__checkError ? `<small class="bm-row-error">${esc(b.__checkError)}</small>` : ''}</td><td data-col="name" class="name"><div class="name-main" title="${esc(b.name)}"><a class="bm-name-link" href="https://business.facebook.com/latest/settings/business_users?business_id=${encodeURIComponent(b.id)}" target="_blank" rel="noopener noreferrer">${esc(b.name||'Không có tên')}</a></div><div class="name-id">${esc(b.id)}</div></td><td data-col="type">${esc(inferLimit(b))}</td><td data-col="ownership">${esc(b.businessRole||b.business_role||'_')}</td><td data-col="limit">${esc(inferType(b))}</td><td data-col="verified"><span class="pill ${vc}">${esc(ver)}</span></td><td data-col="created">${esc(date(b.created_time))}</td><td data-col="admins">${esc(b.businessUsersAdminCount ?? 0)}</td><td data-col="accounts">${arrCount(b.owned_ad_accounts)+arrCount(b.client_ad_accounts)}</td><td data-col="root">${esc(rootId(b))}</td></tr>`}).join(''); applyColumnOrder(); syncSelectAll(); };
  const showNotice=(type,text)=>notice.innerHTML=`<div class="${type}">${esc(text)}</div>`;
  const syncSelectAll = () => {
    const master = document.getElementById('selectAllBms');
    if (!master) return;
    const visible = visibleBusinesses();
    const selectedVisible = visible.filter(b => selectedIds.has(String(b.id))).length;
    master.checked = visible.length > 0 && selectedVisible === visible.length;
    master.indeterminate = selectedVisible > 0 && selectedVisible < visible.length;
  };
  body.addEventListener('change', (event) => {
    const checkbox = event.target.closest('.bm-select');
    if (!checkbox) return;
    const id = String(checkbox.dataset.bmId);
    if (checkbox.checked) selectedIds.add(id); else selectedIds.delete(id);
    syncSelectAll();
  });
  document.addEventListener('change', (event) => {
    if (event.target.id !== 'selectAllBms') return;
    const checked = event.target.checked;
    visibleBusinesses().forEach(b => {
      const id = String(b.id);
      if (checked) selectedIds.add(id); else selectedIds.delete(id);
    });
    render();
  });
    const showDetails=b=>{const owned=Array.isArray(b.owned_ad_accounts?.data)?b.owned_ad_accounts.data:[];drawer.innerHTML=`<div class="detail-head"><div><h3>${esc(b.name||'Business Manager')}</h3><small>${esc(b.id)}</small></div><button class="close" id="close">×</button></div><div class="metrics"><div class="metric"><label>Trạng thái</label><b>${esc(status(b)[0])}</b></div><div class="metric"><label>Verified</label><b>${esc(b.verification_status)}</b></div><div class="metric"><label>Created</label><b>${esc(date(b.created_time))}</b></div><div class="metric"><label>Business users</label><b>${arrCount(b.business_users)}</b></div><div class="metric"><label>Owned ad accounts</label><b>${arrCount(b.owned_ad_accounts)}</b></div><div class="metric"><label>Client ad accounts</label><b>${arrCount(b.client_ad_accounts)}</b></div></div>${owned.length?`<div class="sub-title">Owned Ad Accounts</div><table class="mini"><thead><tr><th>ID</th><th>Currency</th><th>Status</th><th>Adtrust DSL</th></tr></thead><tbody>${owned.map(a=>`<tr><td>${esc(a.id)}</td><td>${esc(a.currency)}</td><td>${esc(a.account_status)}</td><td>${esc(a.adtrust_dsl)}</td></tr>`).join('')}</tbody></table>`:''}`;drawer.classList.add('open');document.getElementById('close').onclick=()=>drawer.classList.remove('open');};
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  const isRetryableMessage = message => {
    const text = String(message || '').toLowerCase();
    return !text || text.includes('timeout') || text.includes('network') ||
      text.includes('receiving end') || text.includes('no response') ||
      text.includes('rate') || text.includes('failed to fetch') || text.includes('networkerror') || text.includes('429') || text.includes('502') ||
      text.includes('503') || text.includes('504') || text.includes('limit endpoint') ||
      text.includes('chưa nhận được limit');
  };
  async function checkOneWithRetry(business, maxAttempts = 3) {
    let lastError = 'Kiểm tra thất bại';
    for (let attempt = 1; attempt <= maxAttempts; attempt++) {
      try {
        const response = await send('CHECK_BM', { businessId: business.id });
        if (response?.success) {
          const checked = response.data?.business || {};
          Object.assign(business, checked);
          business.__checked = true;
          business.__checkError = '';
          if (String(business.adAccountLimit ?? '').trim() !== '_' && String(business.businessRole ?? '').trim() !== '_') return true;
          lastError = 'Chưa nhận được Limit';
        } else {
          lastError = response?.error || 'Kiểm tra thất bại';
        }
      } catch (error) {
        lastError = error.message || 'Kiểm tra thất bại';
      }
      if (attempt < maxAttempts && isRetryableMessage(lastError)) {
        await wait(700 * Math.pow(2, attempt - 1) + Math.floor(Math.random() * 350));
      } else if (attempt < maxAttempts) {
        break;
      }
    }
    business.__checkError = lastError;
    console.warn('[BM CHECK ERROR]', business.id, business.name, lastError);
    return false;
  }
  async function autoCheckAll(){
    const batchSize = 50;
    const concurrency = 5;
    let completed = 0;
    for (let offset = 0; offset < businesses.length; offset += batchSize) {
      const batch = businesses.slice(offset, offset + batchSize);
      batch.forEach(b => { b.__checking = true; b.__checkError = ''; });
      render();
      showNotice('loading', `Đang kiểm tra BM: ${completed}/${businesses.length} · Lô ${Math.floor(offset / batchSize) + 1}`);
      for (let cursor = 0; cursor < batch.length; cursor += concurrency) {
        const group = batch.slice(cursor, cursor + concurrency);
        await Promise.all(group.map(async business => {
          try { await checkOneWithRetry(business, 3); }
          finally { business.__checking = false; completed++; }
        }));
        render();
        showNotice('loading', `Đang kiểm tra BM: ${completed}/${businesses.length} · Lô ${Math.floor(offset / batchSize) + 1}`);
        if (cursor + concurrency < batch.length) await wait(250);
      }
    }
    const failed = businesses.filter(b => b.__checkError).length;
    showNotice(failed ? 'error' : 'loading', failed
      ? `Đã kiểm tra ${businesses.length - failed}/${businesses.length}; còn ${failed} BM cần thử lại.`
      : `Đã kiểm tra ${businesses.length}/${businesses.length} BM`);
  }

  const personalValue = (account, key) => {
    const value = account?.[key];
    if (value === undefined || value === null || value === '') return '—';
    if (typeof value === 'object') return value.id || value.name || value.display_string || '—';
    return value;
  };
  const personalMoney = value => {
    if (value === undefined || value === null || value === '') return '—';
    if (typeof value === 'object') return value.amount ?? value.value ?? '—';
    return value;
  };
  const personalCurrency = account => String(account?.currency || 'USD').trim().toUpperCase();
  const personalMoneyNumber = value => {
    const raw = personalMoney(value);
    if (raw === '—') return null;
    if (typeof raw === 'number') return Number.isFinite(raw) ? raw : null;
    const normalized = String(raw).replace(/[^0-9+\-.,]/g, '').replace(/,(?=\d{3}(?:\D|$))/g, '').replace(',', '.');
    const number = Number(normalized);
    return Number.isFinite(number) ? number : null;
  };
  const personalMoneyFormatters = new Map();
  const personalFormatMoney = (account, value) => {
    const number = personalMoneyNumber(value);
    if (number === null) return '—';
    const currency = personalCurrency(account);
    if (currency === 'VND') return `${new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 0 }).format(Math.round(number))} VNĐ`;
    try {
      if (!personalMoneyFormatters.has(currency)) personalMoneyFormatters.set(currency, new Intl.NumberFormat('en-US', { style: 'currency', currency, currencyDisplay: 'symbol', maximumFractionDigits: 0 }));
      return personalMoneyFormatters.get(currency).format(Math.round(number));
    } catch {
      return `${new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 }).format(Math.round(number))} ${currency}`;
    }
  };
  const personalMaybeMoney = (account, value) => personalMoneyNumber(value) === null ? personalMoney(value) : personalFormatMoney(account, value);
  const personalLimit = account => {
    const value = personalMoney(account?.adtrust_dsl);
    if (String(value).trim() === '-1') return 'NOLIMIT';
    return personalMaybeMoney(account, value);
  };
  const personalThreshold = account => 
    personalMoney(account?.adspaymentcycle?.data?.[0]?.threshold_amount);

const personalThresholdRemaining = account => {
    const threshold = personalMoneyNumber(personalThreshold(account));
    const balance = personalMoneyNumber(account?.balance);
    return threshold !== null && balance !== null
        ? personalFormatMoney(account, Math.max(0, threshold - balance))
        : '—';
};
  const personalSpend = account => personalMoney(account?.amount_spent ?? account?.insights?.data?.[0]?.spend ?? account?.insights?.spend);
  const personalStatus = account => ({ '1': 'Đang hoạt động', '2': 'Vô hiệu hóa', '3': 'Cần thanh toán', '8': 'Đang chờ thanh toán', '100': 'Đang chờ đóng tài khoản', '101': 'Đã đóng tài khoản' }[String(account?.account_status)] || personalValue(account, 'account_status'));
  const personalType = account => account?.is_prepay_account === true || String(account?.is_prepay_account).toLowerCase() === 'true' ? 'Tài khoản trả trước' : account?.is_prepay_account === false || String(account?.is_prepay_account).toLowerCase() === 'false' ? 'Tài khoản trả sau' : '—';
  const personalPayment = account => {
    const payment = account?.all_payment_methods || {};
    const card = payment.pm_credit_card?.display_string || payment.pm_credit_card?.data?.[0]?.display_string;
    const debit = payment.payment_method_direct_debits?.display_string;
    const paypal = payment.payment_method_paypal?.email_address;
    if (card || debit || paypal) return card || debit || paypal;
    if (account?.funding_source_details && String(account.funding_source_details).trim()) return account.funding_source_details;
    return '—';
  };
  const personalDaysToBill = account => {
    if (!account?.next_bill_date) return '—';
    const days = Math.ceil((new Date(account.next_bill_date).getTime() - Date.now()) / 86400000);
    return Number.isFinite(days) ? String(Math.max(0, days)) : '—';
  };
  const renderPersonal = () => {
    const query = search.value.trim().toLowerCase();
    const rows = personalAccounts.filter(a =>
      String(a.name || '').toLowerCase().includes(query) ||
      String(a.account_id || '').includes(query)
    );
    const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
    personalPage = Math.min(personalPage, totalPages);
    const pageRows = rows.slice((personalPage - 1) * PAGE_SIZE, personalPage * PAGE_SIZE);
    count.textContent = rows.length;
    countLabel.textContent = 'Tài khoản cá nhân';
    updatePagination(totalPages);
    personalBody.innerHTML = pageRows.map((account, index) => { const accountId = String(account.account_id || account.id || ''); return `<tr>
      <td data-pcol="0" class="check-col"><input type="checkbox" class="personal-select" data-account-id="${esc(accountId)}" aria-label="Chọn TKQC ${esc(accountId)}" ${selectedPersonalIds.has(accountId) ? 'checked' : ''}></td>
      <td data-pcol="1">${(personalPage - 1) * PAGE_SIZE + index + 1}</td>
      <td data-pcol="2" class="name"><div class="name-main">${esc(personalValue(account, 'name'))}</div></td>
      <td data-pcol="3">${esc(personalValue(account, 'account_id'))}</td>
      <td data-pcol="4">${esc(personalFormatMoney(account, account.balance))}</td>
      <td data-pcol="5">${esc(personalFormatMoney(account, personalThreshold(account)))}</td>
      <td data-pcol="6">${esc(personalThresholdRemaining(account))}</td>
      <td data-pcol="7">${esc(personalLimit(account))}</td>
      <td data-pcol="8">${esc(personalFormatMoney(account, personalSpend(account)))}</td>
      <td data-pcol="9">${esc(account.__detailError || personalStatus(account))}</td>
      <td data-pcol="10">${esc(personalValue(account, 'currency'))}</td>
      <td data-pcol="11">${esc(personalValue(account, 'owner'))}</td>
      <td data-pcol="12">${esc(personalFormatMoney(account, account.spend_cap))}</td>
      <td data-pcol="13">${esc(personalPayment(account))}</td>
      <td data-pcol="14">${esc(date(account.next_bill_date))}</td>
      <td data-pcol="15">${esc(personalDaysToBill(account))}</td>
      <td data-pcol="16">${esc(personalValue(account, 'disable_reason'))}</td>
      <td data-pcol="17">${esc(date(account.created_time))}</td>
      <td data-pcol="18">${esc(personalType(account))}</td>
      <td data-pcol="19">${esc(personalValue(account, 'timezone_name'))}</td>
      <td data-pcol="20">${esc(personalValue(account, 'owner_business'))}</td>
      <td data-pcol="21">${esc(personalValue(account, 'business_country_code'))}</td>
    </tr>`; }).join('');
    syncPersonalSelectAll(pageRows);
    applyPersonalColumnOrder();
  };
  const syncPersonalSelectAll = visibleRows => {
    const master = document.getElementById('selectAllPersonal');
    if (!master) return;
    const ids = visibleRows.map(account => String(account.account_id || account.id || ''));
    const selected = ids.filter(id => selectedPersonalIds.has(id)).length;
    master.checked = ids.length > 0 && selected === ids.length;
    master.indeterminate = selected > 0 && selected < ids.length;
  };
  personalBody.addEventListener('change', event => {
    const checkbox = event.target.closest('.personal-select');
    if (!checkbox) return;
    const id = String(checkbox.dataset.accountId || '');
    if (checkbox.checked) selectedPersonalIds.add(id); else selectedPersonalIds.delete(id);
    syncPersonalSelectAll(visiblePersonalRows());
  });
  const visiblePersonalRows = () => {
    const query = search.value.trim().toLowerCase();
    const rows = personalAccounts.filter(account => String(account.name || '').toLowerCase().includes(query) || String(account.account_id || '').includes(query));
    return rows.slice((personalPage - 1) * PAGE_SIZE, personalPage * PAGE_SIZE);
  };
  document.addEventListener('change', event => {
    if (event.target.id !== 'selectAllPersonal') return;
    visiblePersonalRows().forEach(account => { const id = String(account.account_id || account.id || ''); if (event.target.checked) selectedPersonalIds.add(id); else selectedPersonalIds.delete(id); });
    renderPersonal();
  });
  async function checkPersonalAccountsInBatches() {
    const batchSize = 25;
    const concurrency = 2;
    const batches = [];
    for (let offset = 0; offset < personalAccounts.length; offset += batchSize) {
      batches.push(personalAccounts.slice(offset, offset + batchSize));
    }

    let nextBatch = 0;
    let completed = 0;
    const runWorker = async () => {
      while (nextBatch < batches.length) {
        const batchIndex = nextBatch++;
        const batch = batches[batchIndex];
        const accountIds = batch.map(account => String(account.account_id || account.id || '')).filter(Boolean);
        batch.forEach(account => { account.__checking = true; account.__detailError = ''; });
        renderPersonal();
        personalNotice.innerHTML = `<div class="loading">Đã tải ${personalAccounts.length} TKQC. Đang kiểm tra ${completed}/${personalAccounts.length} · Tối đa 2 lô song song</div>`;

        try {
          const response = await send('CHECK_PERSONAL_ACCOUNTS_BATCH', { accountIds });
          if (!response.success) throw new Error(response.error || 'Check batch TKQC thất bại.');
          const checked = response.data?.accounts || [];
          const checkedMap = new Map(checked.map(account => [String(account.account_id || account.id), account]));
          batch.forEach(account => {
            const detail = checkedMap.get(String(account.account_id || account.id));
            if (detail) Object.assign(account, detail);
            else account.__detailError = 'Không nhận được dữ liệu chi tiết.';
            account.__checking = false;
          });
        } catch (error) {
          batch.forEach(account => {
            account.__checking = false;
            account.__detailError = error.message || 'Không check được TKQC.';
          });
        }

        completed += batch.length;
        renderPersonal();
        personalNotice.innerHTML = `<div class="loading">Đã kiểm tra ${Math.min(completed, personalAccounts.length)}/${personalAccounts.length} TKQC.</div>`;
      }
    };

    await Promise.all(
      Array.from({ length: Math.min(concurrency, batches.length) }, runWorker)
    );
    personalNotice.innerHTML = `<div class="loading">Đã hoàn tất kiểm tra ${personalAccounts.length} TKQC.</div>`;
  }
  async function checkPersonalSupplementInBatches() {
    const batchSize = 25;
    const concurrency = 2;
    const batches = [];
    for (let offset = 0; offset < personalAccounts.length; offset += batchSize) batches.push(personalAccounts.slice(offset, offset + batchSize));
    let nextBatch = 0;
    let completed = 0;
    const runWorker = async () => {
      while (nextBatch < batches.length) {
        const batch = batches[nextBatch++];
        const accountIds = batch.map(account => String(account.account_id || account.id || '')).filter(Boolean);
        batch.forEach(account => { account.__supplementChecking = true; });
        renderPersonal();
        try {
          const response = await send('CHECK_PERSONAL_ACCOUNTS_SUPPLEMENT_BATCH', { accountIds });
          if (!response.success) throw new Error(response.error || 'Check bổ sung TKQC thất bại.');
          const checked = response.data?.accounts || [];
          const checkedMap = new Map(checked.map(account => [String(account.account_id || account.id), account]));
          batch.forEach(account => {
            const detail = checkedMap.get(String(account.account_id || account.id));
            if (detail) Object.assign(account, detail);
            account.__supplementChecking = false;
          });
        } catch (error) {
          batch.forEach(account => {
            account.__supplementChecking = false;
            account.__supplementError = error.message || 'Không check được dữ liệu bổ sung.';
          });
        }
        completed += batch.length;
        renderPersonal();
        personalNotice.innerHTML = `<div class="loading">Đã check thông tin bổ sung ${Math.min(completed, personalAccounts.length)}/${personalAccounts.length} TKQC · Ngưỡng · Trạng thái · Loại TK · Thẻ thanh toán</div>`;
      }
    };
    await Promise.all(Array.from({ length: Math.min(concurrency, batches.length) }, runWorker));
    personalNotice.innerHTML = `<div class="loading">Đã hoàn tất check bổ sung ${personalAccounts.length} TKQC.</div>`;
  }
  async function loadPersonal() {
    personalNotice.innerHTML = '<div class="loading">Đang tải danh sách TKQC cá nhân...</div>';
    personalBody.innerHTML = '';
    try {
      const ping = await send('PING');
      if (!ping.success) throw new Error(ping.error);
      const session = await send('CHECK_SESSION');
      if (!session.success) throw new Error(session.error);
      const response = await send('LOAD_PERSONAL_ACCOUNTS_LIST');
      if (!response.success) throw new Error(response.error);
      personalAccounts = response.data?.accounts || [];
      personalNotice.innerHTML = personalAccounts.length
        ? `<div class="loading">Đã tải ${personalAccounts.length} TKQC. Đang hiển thị Tên và ID, chuẩn bị check theo lô 25...</div>`
        : '<div class="empty">Chưa có TKQC cá nhân.</div>';
      renderPersonal();
      if (personalAccounts.length) {
        await checkPersonalAccountsInBatches();
        await checkPersonalSupplementInBatches();
      }
    } catch (error) {
      personalNotice.innerHTML = `<div class="error">${esc(error.message || 'Không thể tải TKQC cá nhân.')}</div>`;
    }
  }
  const switchTab = tab => {
    activeTab = tab;
    const isPersonal = tab === 'personal';
    personalView.style.display = isPersonal ? 'flex' : 'none';
    bmView.style.display = isPersonal ? 'none' : 'flex';
    document.getElementById('personalTab').classList.toggle('active', isPersonal);
    document.getElementById('bmTab').classList.toggle('active', !isPersonal);
    countLabel.textContent = isPersonal ? 'Tài khoản cá nhân' : 'Tài khoản BM';
    if (isPersonal && !personalAccounts.length) loadPersonal();
    else if (isPersonal) renderPersonal();
    else render();
  };
  prevPage.onclick = () => { if (activeTab === 'personal') personalPage = Math.max(1, personalPage - 1); else bmPage = Math.max(1, bmPage - 1); activeTab === 'personal' ? renderPersonal() : render(); };
  nextPage.onclick = () => { if (activeTab === 'personal') personalPage++; else bmPage++; activeTab === 'personal' ? renderPersonal() : render(); };
  document.getElementById('personalTab').onclick = () => switchTab('personal');
  document.getElementById('bmTab').onclick = () => switchTab('bm');
  document.getElementById('pageTab').onclick = () => alert('Chức năng Page sẽ được bổ sung sau.');
  setupColumnDrag();
  setupPersonalColumnControls();
  document.querySelectorAll('.sort-btn').forEach(btn=>btn.onclick=()=>{const key=btn.dataset.sort;if(key==='status'){statusFilter=statusFilter==='Live'?'Restricted':statusFilter==='Restricted'?'':'Live';sortKey='';document.querySelectorAll('.sort-btn').forEach(x=>x.classList.remove('active'));if(statusFilter)btn.classList.add('active');}else{if(sortKey===key)sortDirection*=-1;else{sortKey=key;sortDirection=1;}statusFilter='';document.querySelectorAll('.sort-btn').forEach(x=>x.classList.remove('active'));btn.classList.add('active');}render();});
  async function load(){showNotice('loading','Đang kết nối extension và tải danh sách BM...');body.innerHTML='';try{const p=await send('PING');if(!p.success)throw new Error(p.error);const s=await send('CHECK_SESSION');if(!s.success)throw new Error(s.error);const r=await send('LOAD_BM');if(!r.success)throw new Error(r.error);businesses=r.data?.businesses||[];notice.innerHTML=businesses.length?'':'<div class="empty">Chưa có dữ liệu BM.</div>';render();if(businesses.length)await autoCheckAll();}catch(e){showNotice('error',e.message||'Không thể tải BM.');}}
  document.getElementById('reloadBtn').onclick=()=>activeTab==='personal'?loadPersonal():load();
  search.oninput=()=>{bmPage=1;personalPage=1;activeTab==='personal'?renderPersonal():render();};
  document.getElementById('clearSearch').onclick=()=>{search.value='';bmPage=1;personalPage=1;activeTab==='personal'?renderPersonal():render();};
  load();
})();
</script>
</body>
